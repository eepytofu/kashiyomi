# Dependency updates. SudachiDict is not here: it is not a package manager
# dependency; its pin lives in dictionary-releases.json and only changes
# through `npm run pin-dict`.
#
# Grouped so a week of patch bumps arrives as one PR rather than six.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # These three decide what a reading looks like; review them individually.
      reading-libraries:
        patterns:
          - pinyin-pro
          - "@pinyin-pro/data"
          - opencc-js
      # Build tooling cannot change a reading, only whether it compiles.
      toolchain:
        patterns:
          - esbuild
          - typescript
          - "@types/node"

  - package-ecosystem: cargo
    directory: /native
    schedule:
      interval: weekly
    groups:
      rust:
        patterns:
          - "*"
