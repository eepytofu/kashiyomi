[package]
name = "kashiyomi-backend"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Kashiyomi native backend: Sudachi morphological analysis for BetterNCM"

[lib]
name = "kashiyomi_backend"
# rlib so the analyze CLI can link the same analyzer the plugin uses.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "analyze"
path = "src/bin/analyze.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
hex = "0.4"
# Not published on crates.io; pinned to the commit whose API this code targets.
sudachi = { git = "https://github.com/WorksApplications/sudachi.rs.git", rev = "f4dd8f20a774bd71d34a7d4ffa00d987b8946f9e", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
# Thin Win32 bindings only. WinHTTP performs the runtime transfer; no HTTP
# framework or TLS stack is linked into the plugin.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Networking_WinHttp",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
# Already in the tree via sudachi, which holds the .dic as `Storage::File(Mmap)`.
# Tests use it to hold a real mapping, so "unload before renaming" is checked
# against the OS rather than against a comment.
memmap2 = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
